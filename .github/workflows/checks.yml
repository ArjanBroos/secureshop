name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Check formatting
        run: cd backend && ./mvnw spotless:check -q

      - name: Build and test
        run: cd backend && ./mvnw verify -q

      - name: Scan for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-git

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Check formatting
        run: npx prettier --check "frontend/src/**/*.{ts,tsx,css,json}"

      - name: Lint
        run: cd frontend && npm run lint

      - name: Type check
        run: cd frontend && npm run type-check

      - name: Test
        run: cd frontend && npm test

  docker:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v6

      - name: Build backend image
        run: docker build -t backend:ci ./backend

      - name: Build frontend image
        run: docker build -t frontend:ci ./frontend

      - name: Install Trivy
        run: |
          curl -sSfL https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.tar.gz \
            | tar xz -C /tmp trivy

      - name: Scan backend image
        run: /tmp/trivy image --exit-code 1 --severity HIGH,CRITICAL --ignorefile .trivyignore backend:ci

      - name: Scan frontend image
        run: /tmp/trivy image --exit-code 1 --severity HIGH,CRITICAL --ignorefile .trivyignore frontend:ci
